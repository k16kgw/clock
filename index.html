<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="現在時刻（日本時間）の表示と、学会用タイムキーパー（1鈴・2鈴・3鈴）">
  <title>時計</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-view="clock">
  <header id="bar">
    <nav class="tabs" role="tablist" aria-label="表示切り替え">
      <button type="button" role="tab" data-view="clock" aria-selected="true">時計</button>
      <button type="button" role="tab" data-view="timer" aria-selected="false">タイマー</button>
    </nav>
    <button type="button" id="fs-btn" class="icon-btn" title="全画面 (F)" aria-label="全画面">⛶</button>
  </header>

  <!-- Clock -->
  <section id="view-clock" class="view" aria-label="時計">
    <div id="clock-time" class="big">--<span class="colon">:</span>--<span class="colon">:</span>--</div>
    <div id="clock-date" class="sub"></div>
    <div id="clock-hint" class="hint" hidden>クリック / タップ / F キーで全画面</div>
  </section>

  <!-- Timekeeper -->
  <section id="view-timer" class="view" aria-label="タイムキーパー" hidden>
    <div class="bell-marks" aria-label="鈴の状態">
      <span class="bell-mark" data-bell="1"><i></i>1鈴</span>
      <span class="bell-mark" data-bell="2"><i></i>2鈴</span>
      <span class="bell-mark" data-bell="3"><i></i>3鈴</span>
    </div>
    <div id="timer-main" class="big">0:00</div>
    <div id="timer-sub" class="sub">&nbsp;</div>
    <button type="button" id="timer-audio-warn" class="warn" hidden></button>

    <div class="controls">
      <button type="button" id="timer-start" class="btn primary">開始</button>
      <button type="button" id="timer-reset" class="btn">リセット</button>
      <button type="button" id="timer-ring" class="btn" title="鈴を 1 回鳴らす (B)">🔔 鳴らす</button>
      <button type="button" id="timer-settings-btn" class="btn" aria-expanded="false" aria-controls="timer-settings">設定</button>
    </div>

    <form id="timer-settings" class="panel" hidden>
      <fieldset>
        <legend>鈴の時間（分:秒）</legend>
        <label class="bell-row"><input type="checkbox" data-bell-on="1"> 1鈴 <input type="text" inputmode="numeric" data-bell-time="1" placeholder="10:00" size="6"> <small>1 回</small></label>
        <label class="bell-row"><input type="checkbox" data-bell-on="2"> 2鈴 <input type="text" inputmode="numeric" data-bell-time="2" placeholder="12:00" size="6"> <small>2 回</small></label>
        <label class="bell-row"><input type="checkbox" data-bell-on="3"> 3鈴 <input type="text" inputmode="numeric" data-bell-time="3" placeholder="15:00" size="6"> <small>3 回</small></label>
        <p id="timer-error" class="error" role="alert" hidden></p>
      </fieldset>
      <fieldset>
        <legend>表示</legend>
        <label><input type="radio" name="mode" value="up"> カウントアップ（経過時間）</label>
        <label><input type="radio" name="mode" value="down"> カウントダウン（残り時間）</label>
      </fieldset>
      <fieldset>
        <legend>音量</legend>
        <div class="volume-row">
          <input type="range" id="timer-volume" min="0" max="1" step="0.05" aria-label="音量">
          <button type="button" id="timer-test" class="btn small">テスト</button>
        </div>
      </fieldset>
    </form>

    <p class="keys">Space 開始/一時停止 · R リセット · B 鈴 · F 全画面</p>
  </section>

  <noscript><p class="sub">この時計の表示には JavaScript を有効にしてください。</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
