<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="現在時刻（日本時間）を大きく表示する時計">
  <title>時計</title>
  <style>
    :root {
      --bg: #0b0d10;
      --fg: #f2f4f7;
      --muted: #9aa4b2;
      --dim: #5b6573;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #time {
      font-size: min(19vw, 40vh);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    #time .colon { color: var(--dim); }
    #date {
      margin-top: min(3vw, 5vh);
      font-size: min(5vw, 9vh);
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    #hint {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      text-align: center;
      font-size: 14px;
      color: var(--dim);
      transition: opacity 1s ease;
    }
    #hint.hidden { opacity: 0; }
  </style>
</head>
<body>
  <main>
    <div id="time" aria-live="off">--<span class="colon">:</span>--<span class="colon">:</span>--</div>
  </main>
  <div id="date"></div>
  <div id="hint" hidden>クリック / タップ / F キーで全画面</div>
  <noscript><p style="margin-top:1em;color:#9aa4b2">時刻の表示には JavaScript を有効にしてください。</p></noscript>

  <script>
    (() => {
      "use strict";

      const TIME_ZONE = "Asia/Tokyo";
      const timeEl = document.getElementById("time");
      const dateEl = document.getElementById("date");
      const hintEl = document.getElementById("hint");

      const timeFmt = new Intl.DateTimeFormat("ja-JP", {
        timeZone: TIME_ZONE,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23",
      });
      const dateFmt = new Intl.DateTimeFormat("ja-JP", {
        timeZone: TIME_ZONE,
        year: "numeric",
        month: "numeric",
        day: "numeric",
        weekday: "short",
      });

      const partsOf = (fmt, date) =>
        Object.fromEntries(fmt.formatToParts(date).map((p) => [p.type, p.value]));

      let lastDateText = "";
      let timer = 0;

      function render() {
        const now = new Date();
        const t = partsOf(timeFmt, now);
        const colon = '<span class="colon">:</span>';
        timeEl.innerHTML = t.hour + colon + t.minute + colon + t.second;

        const d = partsOf(dateFmt, now);
        const dateText = `${d.year}年${d.month}月${d.day}日（${d.weekday}）`;
        if (dateText !== lastDateText) {
          dateEl.textContent = dateText;
          lastDateText = dateText;
        }
        document.title = `${t.hour}:${t.minute} 時計`;
      }

      // Re-sync to the next second boundary each tick so the display never drifts.
      function tick() {
        render();
        clearTimeout(timer);
        timer = setTimeout(tick, 1000 - (Date.now() % 1000) + 10);
      }

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) tick();
      });

      // Fullscreen toggle (not available on some phones, e.g. iPhone Safari).
      const root = document.documentElement;
      const canFullscreen = Boolean(root.requestFullscreen || root.webkitRequestFullscreen);

      function toggleFullscreen() {
        if (!canFullscreen) return;
        const current = document.fullscreenElement || document.webkitFullscreenElement;
        if (current) {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        } else {
          const req = root.requestFullscreen || root.webkitRequestFullscreen;
          const result = req.call(root);
          if (result && result.catch) result.catch(() => {});
        }
      }

      if (canFullscreen) {
        hintEl.hidden = false;
        setTimeout(() => hintEl.classList.add("hidden"), 4000);
        document.addEventListener("click", toggleFullscreen);
        document.addEventListener("keydown", (e) => {
          if ((e.key === "f" || e.key === "F") && !e.metaKey && !e.ctrlKey && !e.altKey) {
            toggleFullscreen();
          }
        });
      } else {
        document.body.style.cursor = "default";
      }

      tick();
    })();
  </script>
</body>
</html>
